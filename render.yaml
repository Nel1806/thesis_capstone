services:
  - type: web
    name: thesis2-teacher-audit
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/eiceejohn00/thesis2.0.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Teacher Audit System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: ADMIN_EMAIL
        value: admin@deped.gov.ph
      - key: ADMIN_PASSWORD
        sync: false
